<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TWO BRO ROYALE — Wear Your Royalty</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 2px;
    }

    header p {
      margin-top: 6px;
      color: #ccc;
    }

    .hero {
      background: linear-gradient(135deg, #111, #333);
      color: white;
      text-align: center;
      padding: 70px 20px;
    }

    .hero h2 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 25px;
      color: #ddd;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: white;
      color: #111;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .section {
      max-width: 1100px;
      margin: auto;
      padding: 45px 20px;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 30px;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }

    .product {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 18px;
    }

    .product h3 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .old-price {
      color: #888;
      text-decoration: line-through;
      margin-left: 7px;
      font-size: 14px;
    }

    .category {
      color: #777;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .buy-btn {
      width: 100%;
      border: none;
      padding: 11px;
      background: #111;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .buy-btn:hover {
      background: #333;
    }

    .empty {
      text-align: center;
      grid-column: 1 / -1;
      padding: 30px;
      color: #777;
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px 15px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .hero h2 {
        font-size: 30px;
      }

      header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>TWO BRO ROYALE</h1>
    <p>Wear Your Royalty</p>
  </header>

  <section class="hero">
    <h2>Wear Your Royalty</h2>
    <p>Premium fashion made for your royal style.</p>
    <a href="#shop" class="btn">Shop Now</a>
  </section>

  <section class="section" id="shop">
    <h2>Our Collection</h2>

    <div id="products">
      <div class="empty">Loading products...</div>
    </div>
  </section>

  <footer>
    <p>© 2026 TWO BRO ROYALE</p>
    <p>Wear Your Royalty</p>
  </footer>

  <script>
    async function loadProducts() {
      const container = document.getElementById("products");

      try {
        const response = await fetch("/api/products");

        if (!response.ok) {
          throw new Error("Could not load products");
        }

        const products = await response.json();

        if (!products.length) {
          container.innerHTML =
            '<div class="empty">No products available yet.</div>';
          return;
        }

        container.innerHTML = products.map(product => `
          <div class="product">

            ${
              product.image_url
                ? `<img src="${product.image_url}" alt="${product.name}">`
                : `<div style="height:260px;background:#eee;display:flex;align-items:center;justify-content:center;color:#888;">
                    TWO BRO ROYALE
                   </div>`
            }

            <div class="product-info">

              <h3>${product.name}</h3>

              <div class="price">
                ৳${Number(product.price_bdt).toLocaleString()}
                ${
                  product.old_price_bdt
                    ?
